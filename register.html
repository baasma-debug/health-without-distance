<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register · Health Without Distance</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== Same design system as doctors.html ===== */
        :root {
            --primary: linear-gradient(135deg, #4889ac 0%, #b8dce8 100%);
            --primary-solid: #2b5f70;
            --primary-dark: #2a5b6d;
            --secondary: linear-gradient(135deg, #50a4c0 0%, #4889ac 100%);
            --secondary-solid: #50a4c0;
            --accent: #27AE60;
            --success: #27AE60;
            --error: #ff6b9d;
            --dark: #1A1A2E;
            --dark-light: #2b5f70;
            --gray: #64748B;
            --gray-light: #f7fbfd;
            --white: #ffffff;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.12);
            --shadow-lg: 0 10px 40px rgba(43,95,112,0.25);
            --shadow-xl: 0 20px 60px rgba(43,95,112,0.3);
            --transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Main container */
        .register-wrapper {
            max-width: 900px;
            width: 100%;
            margin: 2rem auto;
        }

        /* Page title (same as in doctors.html) */
        .page-title {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
            background: var(--primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        /* Form container */
        .form-container {
            background: var(--white);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: var(--shadow-xl);
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form rows */
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .form-col,
        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 2rem;
        }

        label {
            font-weight: 600;
            margin-bottom: 0.7rem;
            color: var(--dark);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        label i {
            color: var(--primary-solid);
            font-size: 1rem;
        }

        input,
        select,
        textarea {
            padding: 1rem 1.2rem;
            border: 2px solid var(--gray-light);
            border-radius: 12px;
            font-size: 1rem;
            transition: var(--transition);
            background: var(--white);
            font-family: inherit;
            width: 100%;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-solid);
            box-shadow: 0 0 0 4px rgba(43,95,112,0.1);
            transform: translateY(-2px);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* Form footer (buttons) */
        .form-footer {
            display: flex;
            gap: 1.5rem;
            justify-content: flex-end;
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 2px solid var(--gray-light);
        }

        /* Buttons */
        .btn {
            padding: 0.8rem 1.8rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%,-50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .btn-outline {
            background: transparent;
            color: var(--dark);
            border: 2px solid var(--gray);
            backdrop-filter: blur(10px);
        }

        .btn-outline:hover {
            background: var(--gray-light);
            border-color: var(--primary-solid);
            transform: translateY(-2px);
        }

        /* Cancel button override */
        .btn-outline.cancel {
            background: var(--gray) !important;
            color: white !important;
            border: none;
        }
        .btn-outline.cancel:hover {
            background: var(--dark) !important;
        }

        /* Notification (same as doctors.html) */
        .notification {
            position: fixed;
            top: 100px;
            right: 2rem;
            padding: 1.2rem 1.8rem;
            border-radius: 12px;
            display: none;
            align-items: center;
            gap: 1rem;
            box-shadow: var(--shadow-xl);
            animation: slideInRight 0.5s ease-out;
            z-index: 2000;
            max-width: 400px;
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .notification.success {
            background: linear-gradient(135deg, #27AE60 0%, #229954 100%);
            color: white;
        }

        .notification.error {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff5580 100%);
            color: white;
        }

        .notification i {
            font-size: 1.8rem;
        }

        .notification strong {
            display: block;
            font-size: 1.1rem;
        }

        .notification-message {
            font-size: 0.95rem;
        }

        /* Login link (additional) */
        .login-link {
            text-align: center;
            margin-top: 2rem;
            color: var(--gray);
        }
        .login-link a {
            color: var(--primary-solid);
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }
        .login-link a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-container {
                padding: 1.5rem;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .form-footer {
                flex-direction: column;
            }
            .page-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Notifications (same as in doctors.html) -->
    <div class="notification success" id="successNotification">
        <i class="fas fa-check-circle"></i>
        <div>
            <strong>Success!</strong>
            <div class="notification-message"></div>
        </div>
    </div>
    <div class="notification error" id="errorNotification">
        <i class="fas fa-exclamation-circle"></i>
        <div>
            <strong>Error!</strong>
            <div class="notification-message"></div>
        </div>
    </div>

    <div class="register-wrapper">
        <h1 class="page-title">
            <i class="fas fa-user-plus"></i> Create Doctor Account
        </h1>

        <div class="form-container">
            <form id="doctorRegisterForm">
                <div class="form-row">
                    <div class="form-col">
                        <label for="fullName"><i class="fas fa-user"></i> Full Name *</label>
                        <input type="text" id="fullName" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-col">
                        <label for="email"><i class="fas fa-envelope"></i> Email Address *</label>
                        <input type="email" id="email" placeholder="example@domain.com" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <label for="password"><i class="fas fa-lock"></i> Password *</label>
                        <input type="password" id="password" placeholder="Create a strong password" required>
                    </div>
                    <div class="form-col">
                        <label for="confirmPassword"><i class="fas fa-lock"></i> Confirm Password *</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <label for="specialty"><i class="fas fa-stethoscope"></i> Medical Specialty *</label>
                        <select id="specialty" required>
                            <option value="">Select your specialty</option>
                            <option value="Pediatrics">Pediatrics</option>
                            <option value="Orthopedics">Orthopedics</option>
                            <option value="General Practitioner">General Practitioner</option>
                            <option value="Cardiology">Cardiology</option>
                            <option value="Dermatology">Dermatology</option>
                        </select>
                    </div>
                    <div class="form-col">
                        <label for="phone"><i class="fas fa-phone"></i> Phone Number *</label>
                        <input type="tel" id="phone" placeholder="+1 234 567 890" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address"><i class="fas fa-map-marker-alt"></i> Clinic Address *</label>
                    <input type="text" id="address" placeholder="Enter your clinic address" required>
                </div>

                <div class="form-group">
                    <label for="bio"><i class="fas fa-file-medical"></i> Professional Bio</label>
                    <textarea id="bio" rows="4" placeholder="Tell patients about your experience, qualifications, and approach to care"></textarea>
                </div>

                <div class="form-footer">
                    <button type="button" class="btn btn-outline cancel" id="cancelRegister">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                    <button type="submit" class="btn btn-secondary">
                        Create Account <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </form>

            <div class="login-link">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <script>
        // Show notification function (same as in doctors.html)
        function showNotification(type, message) {
            const notification = document.getElementById(type + 'Notification');
            notification.querySelector('.notification-message').textContent = message;
            notification.style.display = 'flex';
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        // Get existing users from localStorage
        function getUsers() {
            const users = localStorage.getItem('doctorUsers');
            return users ? JSON.parse(users) : [];
        }

        // Save users to localStorage
        function saveUsers(users) {
            localStorage.setItem('doctorUsers', JSON.stringify(users));
        }

        // Handle registration form submission
        document.getElementById('doctorRegisterForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Get form values
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const specialty = document.getElementById('specialty').value;
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const bio = document.getElementById('bio').value.trim();

            // Validation
            if (!fullName || !email || !password || !confirmPassword || !specialty || !phone || !address) {
                showNotification('error', 'Please fill all required fields');
                return;
            }

            if (password !== confirmPassword) {
                showNotification('error', 'Passwords do not match');
                return;
            }

            if (password.length < 6) {
                showNotification('error', 'Password must be at least 6 characters');
                return;
            }

            // Check if email already registered
            const users = getUsers();
            if (users.some(user => user.email === email)) {
                showNotification('error', 'Email already registered');
                return;
            }

            // Create new user object (matches the structure used in login)
            const newUser = {
                name: fullName,
                email: email,
                password: password, // plain text for demo only!
                specialty: specialty,
                phone: phone,
                address: address,
                bio: bio || ''
            };

            users.push(newUser);
            saveUsers(users);

            showNotification('success', 'Account created successfully! Redirecting to login...');

            // Redirect to login page after 2 seconds
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        });

        // Cancel button returns to home (or login)
        document.getElementById('cancelRegister').addEventListener('click', function() {
            window.location.href = 'Doctor.html'; // or 'doctors.html' – adjust as needed
        });
    </script>
</body>
</html>
