<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Your Availability · Health Without Distance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ----- refined, accessible, consistent ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2b5f70;           /* deep teal */
            --primary-light: #3f7d91;
            --primary-dark: #1d4552;
            --secondary: #50a4c0;          /* soft blue */
            --secondary-light: #6eb8d1;
            --secondary-dark: #3b8aa3;
            --accent: #27ae60;              /* green */
            --accent-light: #3fcb7a;
            --dark: #1e293b;
            --gray: #64748b;
            --light: #f0f7fc;
            --white: #ffffff;
            --danger: #ef4444;
            --danger-light: #f87171;
            --danger-dark: #b91c1c;
            --success: #0b5e42;             /* deep emerald */
            --shadow-sm: 0 4px 10px rgba(0,0,0,0.05);
            --shadow-md: 0 8px 20px rgba(0,0,0,0.1);
            --shadow-lg: 0 15px 30px rgba(0,0,0,0.15);
            --border-radius: 24px;
            --transition: all 0.25s ease;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #d9e9f2 0%, #ecf5fa 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            color: var(--dark);
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        /* page title */
        .page-title {
            font-size: 2.2rem;
            font-weight: 600;
            color:white;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            text-shadow: 0 2px 6px rgba(0, 40, 50, 0.4);
            letter-spacing: -0.01em;
        }

        .page-title i {
            background: rgba(255,255,255,0.2);
            padding: 0.8rem;
            border-radius: 50%;
            backdrop-filter: blur(4px);
            font-size: 1.8rem;
        }

        /* main card */
        .availability-container {
            background: var(--white);
            padding: 2.8rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            animation: fadeUp 0.5s ease-out;
            border: 1px solid rgba(255,255,255,0.6);
            backdrop-filter: blur(2px);
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* info header */
        .availability-header {
            display: flex;
            align-items: flex-start;
            gap: 1.2rem;
            padding: 1.6rem 2rem;
            margin-bottom: 2.5rem;
            background: linear-gradient(115deg, rgba(43,95,112,0.06) 0%, rgba(80,164,192,0.06) 100%);
            border-radius: 20px;
            border-left: 6px solid var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .availability-header i {
            font-size: 2rem;
            color: var(--primary);
            background: rgba(43,95,112,0.15);
            padding: 0.8rem;
            border-radius: 50%;
        }

        .availability-header p {
            flex: 1;
            font-size: 1.1rem;
            color: var(--dark);
            margin: 0;
            font-weight: 450;
        }

        /* form row */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.2rem;
            margin-bottom: 2.5rem;
        }

        .form-col {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .form-col label {
            font-weight: 600;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1rem;
            letter-spacing: 0.3px;
        }

        .form-col label i {
            color: var(--primary);
            font-size: 1.2rem;
            width: 1.6rem;
        }

        select {
            width: 100%;
            padding: 1rem 1.2rem;
            border: 2px solid var(--light);
            border-radius: 18px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--dark);
            background: var(--white);
            transition: var(--transition);
            cursor: pointer;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%232b5f70" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>');
            background-repeat: no-repeat;
            background-position: right 1.2rem center;
            background-size: 1.2rem;
        }

        select:hover {
            border-color: var(--primary-light);
            background-color: rgba(43,95,112,0.02);
        }

        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(43,95,112,0.2);
        }

        /* selected slots area */
        .form-group {
            margin: 2.2rem 0 1.8rem;
        }

        .form-group label {
            font-weight: 600;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .form-group label i {
            color: var(--secondary-dark);
            font-size: 1.3rem;
        }

        .selected-slots {
            min-height: 160px;
            padding: 2rem;
            background: var(--light);
            border-radius: 24px;
            border: 2px dashed var(--primary);
            transition: var(--transition);
        }

        .selected-slots:hover {
            border-color: var(--primary-dark);
            background: #e8f1f8;
        }

        .selected-slots > p {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--gray);
            font-style: italic;
            font-weight: 400;
        }

        /* day group cards */
        .day-slot-group {
            margin-bottom: 1.8rem;
            padding: 1.2rem 1.5rem;
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.04);
            border: 1px solid rgba(43,95,112,0.15);
            animation: slideIn 0.2s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .day-slot-group h4 {
            color: var(--primary-dark);
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border-bottom: 2px solid var(--light);
            padding-bottom: 0.7rem;
        }

        .day-slot-group h4 i {
            color: var(--primary);
            font-size: 1.2rem;
        }

        .time-slots {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        /* slot badge */
        .slot-badge {
            background: var(--white);
            padding: 0.7rem 1.4rem;
            border-radius: 40px;
            border: 2px solid var(--primary-light);
            color: var(--primary-dark);
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            font-size: 0.95rem;
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(43,95,112,0.15);
        }

        .slot-badge i {
            font-size: 0.85rem;
            color: var(--primary);
        }

        .slot-badge:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(43,95,112,0.3);
        }

        .slot-badge:hover i {
            color: white;
        }

        .remove-slot {
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            margin-left: 0.3rem;
            font-size: 0.8rem;
        }

        .remove-slot i {
            font-size: 0.8rem;
            color: white;
        }

        .remove-slot:hover {
            background: var(--danger-dark);
            transform: scale(1.15);
            box-shadow: 0 4px 12px rgba(185,28,28,0.4);
        }

        .slot-badge:hover .remove-slot {
            background: white;
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .slot-badge:hover .remove-slot i {
            color: var(--danger);
        }

        .slot-badge:hover .remove-slot:hover {
            background: var(--danger);
            border-color: var(--danger);
        }

        .slot-badge:hover .remove-slot:hover i {
            color: white;
        }

        /* buttons */
        .form-footer {
            display: flex;
            gap: 1.2rem;
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 2px solid var(--light);
            flex-wrap: wrap;
        }

        .btn {
            padding: 1rem 2.2rem;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            flex: 1 1 auto;
            min-width: 200px;
            letter-spacing: 0.3px;
        }

        #addSlotBtn {
            background: var(--primary);
            color: white;
        }

        #addSlotBtn:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 14px 28px rgba(43,95,112,0.4);
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: var(--secondary-dark);
            transform: translateY(-3px);
            box-shadow: 0 14px 28px rgba(80,164,192,0.4);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: var(--shadow-sm);
        }

        /* single dynamic notification */
        .notification {
            position: fixed;
            top: 28px;
            right: 28px;
            background: white;
            padding: 1rem 1.8rem;
            border-radius: 60px;
            box-shadow: 0 16px 32px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 1rem;
            transform: translateX(420px);
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1);
            z-index: 9999;
            max-width: 400px;
            border-left: 6px solid transparent;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            border-left-color: var(--success);
            background: #f0fdf9;
        }

        .notification.error {
            border-left-color: var(--danger);
            background: #fef5f5;
        }

        .notification i {
            font-size: 2rem;
        }

        .notification.success i {
            color: var(--success);
        }

        .notification.error i {
            color: var(--danger);
        }

        .notification strong {
            font-size: 1rem;
            display: block;
            margin-bottom: 0.1rem;
        }

        .notification-message {
            font-size: 0.95rem;
            color: var(--dark);
        }

        /* responsive */
        @media (max-width: 700px) {
            body { padding: 1rem; }
            .availability-container { padding: 1.8rem; }
            .form-row { grid-template-columns: 1fr; gap: 1.2rem; }
            .form-footer { flex-direction: column; }
            .btn { width: 100%; }
            .page-title { font-size: 1.8rem; }
            .availability-header { flex-direction: column; align-items: flex-start; }
            .notification { max-width: 90%; right: 16px; }
        }
    </style>
</head>
<body>
    <!-- dynamic notification (one to rule them all) -->
    <div class="notification" id="dynamicNotification">
        <i class="fas" id="notifyIcon"></i>
        <div>
            <strong id="notifyTitle">Success!</strong>
            <div class="notification-message" id="notifyMessage">Time slot added</div>
        </div>
    </div>

    <div class="container">
        <div class="page" id="availability">
            <h1 class="page-title"><i class="fas fa-calendar-check"></i> Set Your Availability</h1>
            
            <div class="availability-container">
                <div class="availability-header">
                    <i class="fas fa-hourglass-half"></i>
                    <p>Choose a day and a time block, then click <strong>Add time slot</strong>. Patients will see these windows for booking. All changes are saved automatically in your browser.</p>
                </div>
                
                <div class="form-row">
                    <div class="form-col">
                        <label for="daySelect"><i class="fas fa-calendar-day"></i> Weekday</label>
                        <select id="daySelect">
                            <option value="monday">Monday</option>
                            <option value="tuesday">Tuesday</option>
                            <option value="wednesday">Wednesday</option>
                            <option value="thursday">Thursday</option>
                            <option value="friday">Friday</option>
                            <option value="saturday">Saturday</option>
                            <option value="sunday">Sunday</option>
                        </select>
                    </div>
                    
                    <div class="form-col">
                        <label for="timeSlotSelect"><i class="fas fa-clock"></i> Time block</label>
                        <select id="timeSlotSelect">
                            <option value="morning">Morning (8 AM – 12 PM)</option>
                            <option value="afternoon">Afternoon (12 PM – 4 PM)</option>
                            <option value="evening">Evening (4 PM – 8 PM)</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-list-ul"></i> Your current weekly slots</label>
                    <div class="selected-slots" id="availableSlots">
                        <p>✨ No time slots selected yet</p>
                    </div>
                </div>
                
                <div class="form-footer">
                    <button type="button" class="btn" id="addSlotBtn">
                        <i class="fas fa-plus-circle"></i> Add time slot
                    </button>
                    <button type="button" class="btn btn-secondary" id="saveAvailabilityBtn">
                        <i class="fas fa-cloud-save"></i> Save availability
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ----- state & mappings -----
            let availability = {};   // { monday: ['morning','afternoon'] }

            const timeSlotLabels = {
                'morning': 'Morning (8 AM – 12 PM)',
                'afternoon': 'Afternoon (12 PM – 4 PM)',
                'evening': 'Evening (4 PM – 8 PM)'
            };

            const dayLabels = {
                'monday': 'Monday', 'tuesday': 'Tuesday', 'wednesday': 'Wednesday',
                'thursday': 'Thursday', 'friday': 'Friday', 'saturday': 'Saturday', 'sunday': 'Sunday'
            };

            // ----- DOM elements -----
            const daySelect = document.getElementById('daySelect');
            const timeSlotSelect = document.getElementById('timeSlotSelect');
            const availableSlotsDiv = document.getElementById('availableSlots');
            const addBtn = document.getElementById('addSlotBtn');
            const saveBtn = document.getElementById('saveAvailabilityBtn');

            // ----- notification controller -----
            const notify = document.getElementById('dynamicNotification');
            const notifyIcon = document.getElementById('notifyIcon');
            const notifyTitle = document.getElementById('notifyTitle');
            const notifyMessage = document.getElementById('notifyMessage');

            function showNotification(type, message) {
                // type: 'success' or 'error'
                notify.className = 'notification'; // reset
                notify.classList.add(type);
                if (type === 'success') {
                    notifyIcon.className = 'fas fa-check-circle';
                    notifyTitle.textContent = '✓ Success';
                } else {
                    notifyIcon.className = 'fas fa-exclamation-triangle';
                    notifyTitle.textContent = '⚠️ Notice';
                }
                notifyMessage.textContent = message;
                notify.classList.add('show');

                setTimeout(() => {
                    notify.classList.remove('show');
                }, 2800);
            }

            // ----- storage helpers -----
            function loadAvailability() {
                try {
                    const saved = localStorage.getItem('doctorAvailability');
                    if (saved) {
                        availability = JSON.parse(saved);
                        // ensure it's an object (cleanup)
                        if (typeof availability !== 'object' || availability === null) availability = {};
                    } else {
                        availability = {};
                    }
                } catch (e) {
                    availability = {};
                }
                displayAvailability();
            }

            function saveToStorage() {
                localStorage.setItem('doctorAvailability', JSON.stringify(availability));
            }

            // ----- render slots from availability -----
            function displayAvailability() {
                // filter days with at least one slot
                const daysWithSlots = Object.keys(availability).filter(day => availability[day] && availability[day].length > 0);
                
                if (daysWithSlots.length === 0) {
                    availableSlotsDiv.innerHTML = '<p>⏳ No time slots selected yet</p>';
                    return;
                }

                // order by weekday
                const dayOrder = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
                let html = '';

                for (let day of dayOrder) {
                    if (availability[day] && availability[day].length > 0) {
                        html += `<div class="day-slot-group">
                            <h4><i class="fas fa-calendar-alt"></i> ${dayLabels[day]}</h4>
                            <div class="time-slots">`;
                        
                        availability[day].forEach(slot => {
                            html += `
                                <div class="slot-badge">
                                    <i class="fas fa-clock"></i> ${timeSlotLabels[slot]}
                                    <button class="remove-slot" data-day="${day}" data-slot="${slot}" aria-label="remove">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>`;
                        });
                        
                        html += `</div></div>`;
                    }
                }

                availableSlotsDiv.innerHTML = html;

                // attach remove handlers
                document.querySelectorAll('.remove-slot').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const day = this.getAttribute('data-day');
                        const slot = this.getAttribute('data-slot');
                        removeSlot(day, slot);
                    });
                });
            }

            // ----- remove slot -----
            function removeSlot(day, slot) {
                if (availability[day] && availability[day].includes(slot)) {
                    const index = availability[day].indexOf(slot);
                    availability[day].splice(index, 1);
                    if (availability[day].length === 0) {
                        delete availability[day];   // keep object clean
                    }
                    saveToStorage();
                    displayAvailability();
                    showNotification('success', 'Time slot removed');
                } else {
                    showNotification('error', 'Slot not found');
                }
            }

            // ----- add slot -----
            addBtn.addEventListener('click', function() {
                const day = daySelect.value;
                const timeSlot = timeSlotSelect.value;

                if (!availability[day]) {
                    availability[day] = [];
                }

                if (availability[day].includes(timeSlot)) {
                    showNotification('error', 'Slot already added for this day');
                    return;
                }

                availability[day].push(timeSlot);
                saveToStorage();
                displayAvailability();
                showNotification('success', `Added ${timeSlotLabels[timeSlot]} on ${dayLabels[day]}`);
            });

            // ----- save (confirm) -----
            saveBtn.addEventListener('click', function() {
                saveToStorage();  // data is already saved, but we give positive feedback
                showNotification('success', 'Availability saved to browser');
            });

            // initial load
            loadAvailability();
        })();
    </script>
</body>
</html>
